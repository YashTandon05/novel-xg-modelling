<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>xG demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  svg { width: 100%; height: auto; border: 1px solid #ccc; touch-action: none; cursor: crosshair; }
  .controls { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; margin: 1rem 0; }
  label { font-size: 0.95rem; }
  button { padding: 0.4rem 0.9rem; font-size: 0.95rem; cursor: pointer; }
  #result { font-size: 1.6rem; font-weight: 600; margin-top: 0.5rem; min-height: 2rem; }
  .legend span { display: inline-flex; align-items: center; gap: 0.3rem; margin-right: 1rem; font-size: 0.85rem; }
  .dot { width: 0.8rem; height: 0.8rem; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
  <h1>Expected Goals (xG) demo</h1>
  <p>Pick where to <b>place</b>, then click on the pitch. Goal is on the right.</p>

  <div class="controls">
    <label><input type="radio" name="mode" value="shot" checked> Shot</label>
    <label><input type="radio" name="mode" value="gk"> Goalkeeper</label>
    <label><input type="radio" name="mode" value="defender"> Defender</label>
    <label>Body part:
      <select id="bodyPart">
        <option>Right Foot</option>
        <option>Left Foot</option>
        <option>Head</option>
      </select>
    </label>
  </div>

  <!-- viewBox is the StatsBomb attacking half: x 60..120, y 0..80 -->
  <svg id="pitch" viewBox="60 0 60 80">
    <rect x="60" y="0" width="60" height="80" fill="#3a8a3a"/>
    <!-- 18-yard box -->
    <rect x="102" y="18" width="18" height="44" fill="none" stroke="#fff" stroke-width="0.3"/>
    <!-- 6-yard box -->
    <rect x="114" y="30" width="6" height="20" fill="none" stroke="#fff" stroke-width="0.3"/>
    <!-- penalty spot -->
    <circle cx="108" cy="40" r="0.4" fill="#fff"/>
    <!-- goal -->
    <line x1="120" y1="36" x2="120" y2="44" stroke="#fff" stroke-width="0.8"/>
    <g id="markers"></g>
  </svg>

  <div class="legend">
    <span><i class="dot" style="background:#f90"></i> Shot</span>
    <span><i class="dot" style="background:#39f"></i> Goalkeeper</span>
    <span><i class="dot" style="background:#e33"></i> Defender</span>
  </div>

  <div class="controls">
    <button id="predict">Predict xG</button>
    <button id="clear">Clear</button>
  </div>
  <div id="result"></div>

<script>
  const API_URL = "https://yashtandon2005-xg-demo.hf.space";

  const svg = document.getElementById("pitch");
  const markers = document.getElementById("markers");
  const result = document.getElementById("result");

  // State: the picks the user has placed.
  let shot = null;       // [x, y]
  let gk = null;         // [x, y]
  let defenders = [];    // [[x, y], ...]

  function mode() {
    return document.querySelector('input[name="mode"]:checked').value;
  }

  // Convert a mouse/touch event into pitch coordinates via the SVG transform.
  function toPitch(evt) {
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX;
    pt.y = evt.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return [
      Math.min(120, Math.max(60, p.x)),
      Math.min(80, Math.max(0, p.y)),
    ];
  }

  function draw() {
    markers.innerHTML = "";
    const add = (xy, color) => {
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", xy[0]);
      c.setAttribute("cy", xy[1]);
      c.setAttribute("r", 1.4);
      c.setAttribute("fill", color);
      c.setAttribute("stroke", "#000");
      c.setAttribute("stroke-width", 0.2);
      markers.appendChild(c);
    };
    defenders.forEach(d => add(d, "#e33"));
    if (gk) add(gk, "#39f");
    if (shot) add(shot, "#f90");
  }

  svg.addEventListener("click", evt => {
    const p = toPitch(evt);
    if (mode() === "shot") shot = p;
    else if (mode() === "gk") gk = p;
    else defenders.push(p);
    draw();
  });

  document.getElementById("clear").addEventListener("click", () => {
    shot = null; gk = null; defenders = [];
    result.textContent = "";
    draw();
  });

  document.getElementById("predict").addEventListener("click", async () => {
    if (!shot) { result.textContent = "Place a shot first."; return; }
    result.textContent = "Predicting…";
    try {
      const resp = await fetch(API_URL + "/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          shot: shot,
          gk: gk,
          defenders: defenders,
          body_part: document.getElementById("bodyPart").value,
        }),
      });
      const data = await resp.json();
      result.textContent = "xG = " + (data.xg * 100).toFixed(1) + "%";
    } catch (e) {
      result.textContent = "Error: could not reach the API.";
    }
  });
</script>
</body>
</html>
